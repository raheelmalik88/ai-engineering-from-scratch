[project]
name = "torch-and-claude"
version = "0.1.0"
description = "Phase 0 lesson 6, exercise 3: a project that needs PyTorch and the Anthropic SDK"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "anthropic>=0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
