# Mac version of code/docker-compose.yml: the nvidia GPU reservation is removed
# (a Mac has no NVIDIA GPU, so compose would refuse to start the service).
services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-dev-mac
    volumes:
      - ./:/workspace
    command: sleep infinity

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
